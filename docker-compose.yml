services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: falcon_pbl
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["falcon_pbl_db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d falcon_pbl"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/falcon_pbl
      SESSION_SECRET: change-this-before-production
      NEXT_PUBLIC_APP_NAME: Falcon PBL Project Hub
      NEXT_PUBLIC_INSTITUTION: GM University, Davanagere
    ports: ["3000:3000"]
volumes:
  falcon_pbl_db:
